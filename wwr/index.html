<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home White Water Rafting Company</title>
        <meta name="description"
        content="This is the home page of the White Water Rafting site">
        <meta name="author" content="Israel Huh Alegria">
        <link rel="stylesheet" href="styles/rafting.css">
    </head>

    <header class="main-header">
        <img src="images/logo.png" alt="Company-logo" class="header-logo">
        <nav class="menu">
            <a href="index.html" class="menu-item">Home</a>
            <a href="about.html" class="menu-item">About Us</a>
            <a href="trips.html" class="menu-item">Trips</a>
            <a href="contact.html" class="menu-item">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <img src="images/home_main.jpg" alt="Rafting background hero banner">
            <h1>White Water Rafting Company</h1>
        </div>

        <section class="newsletter-container">
        <div class="form-box">
            <form action="">
                <h2>Sing up for free to recieve newsletter</h2>
                <div class="form-group">
                    <label for="name">Enter your name:</label>
                    <input type="text" id="name" name="name" placeholder="Name(s)" required>
                </div>
                <div class="form-group">
                    <label for="email">Enter your email:</label>
                    <input type="email" name="email" id="email" placeholder="Email" required>
                </div>

                <button type="submit" class="submit-btn">Sumbit!</button>
            </form>
        </div>
        </section>

        <section class="call-action">
            <h2>Click the image to check our trips</h2>
            <a href="trips.html"><img src="images/trips-a.png" alt=""></a>
        </section>

        <section class="content-section">
            <h2>Some new experiencies</h2>
            <div class="content-grid">
                <figure class="content-card">
                    <img src="images/home-trips2.jpg" alt="">
                    <figcaption>Most adrenaline experiencies<br><span class="title">We specialize in high-consequence whitewater expeditions featuring expert-level rapid navigation. Our offerings include certified safety kayaker escorts, heavy Class IV-V equipment setups, and fast-paced technical courses aimed at delivering the most thrilling outdoor challenge possible.</span>
                    </figcaption>
                </figure>
                <figure class="content-card">
                    <img src="images/home-trips1.jpg" alt="">
                    <figcaption>Most funny experiencies<br><span class="title">Our mission is making water adventures accessible and deeply engaging for everyone. We provide group-focused rapid tours, specialized eco-guides who share local wildlife history during calm stretches, and complete professional photography packages to capture every single laugh along the way.</span>
                    </figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Rafting Company Israel Huh Alegria</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook-square.svg"
                  alt="Facebook Icon"></a>
            <a href="https://linkedin.com"><img src="images/linkedin-square.svg"
                  alt="Linkedin Icon"></a>
            <a href="https://instagram.com"><img src="images/instagram-square.svg"
                  alt="Instagram Icon"></a>
        </nav>
    </footer>
</html>
