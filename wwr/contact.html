<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us White Water Rafting Company</title>
    <meta name="description"
      content="This site contains all of the contact information about the Rafting Company">
    <meta name="author" content="Israel Huh Alegria">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header class="main-header">
        <img src="images/z-wwr-oars.png" alt="Company-logo" class="header-logo">
        <nav class="menu">
            <a href="index.html" class="menu-item">Home</a>
            <a href="about.html" class="menu-item">About Us</a>
            <a href="trips.html" class="menu-item">Trips</a>
            <a href="contact.html" class="menu-item">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <p class="address">123 Main River Street<br>Kolob, California</p>
            <p class="phone">+1 999 999 9999</p>
            <p class="email">info@whitewater.com</p>
        </section>
        <section class="contact-container">
            <div class="map-box">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3176.321855234567!2d-111.954321!3d37.254321!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzfCsDE1JzE1LjYiTiAxMTHCsDU3JzE1LjYiVw!5e0!3m2!1sen!2sus!4v1625000000000!5m2!1sen!2sus"
                  allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <div class="form-box">
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="username" placeholder="Placeholder"
                          required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="useremail" placeholder="Placeholder"
                          required>
                    </div>

                    <fieldset class="radio-group">
                        <legend>Message Purpose</legend>
                        <label for="purpose-general">
                            <input type="radio" id="purpose-general" name="purpose" value="general"
                              checked> General Inquiry
                        </label>
                        <label for="purpose-reservation">
                            <input type="radio" id="purpose-reservation" name="purpose"
                              value="reservation"> Reservation Question
                        </label>
                        <label for="purpose-suggestion">
                            <input type="radio" id="purpose-suggestion" name="purpose"
                              value="suggestion"> Website Suggestion
                        </label>
                    </fieldset>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="usermessage" rows="4" placeholder="Type here"
                          required></textarea>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="newsletter" name="subscribe" value="yes">
                        <label for="newsletter">Please Subscribe me to the monthly
                            newsletter</label>
                    </div>

                    <button type="submit" class="submit-btn">Get in Touch!</button>
                </form>
            </div>
        </section>

        <section class="employee-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure class="employee-card">
                    <!-- Reutilizamos imágenes existentes reales en tu proyecto para evitar fallos de archivo no encontrado -->
                    <img src="images/rafting59_600.jpg"
                      alt="CEO and Founder smiling profile picture">
                    <figcaption>Employee Profile<br><span class="title">CEO & Founder</span>
                    </figcaption>
                </figure>
                <figure class="employee-card">
                    <img src="images/rafting59_600.jpg" alt="Lead River Guide gear profile picture">
                    <figcaption>Employee Profile<br><span class="title">Lead River Guide</span>
                    </figcaption>
                </figure>
                <figure class="employee-card">
                    <img src="images/rafting59_600.jpg"
                      alt="Booking Coordinator office profile picture">
                    <figcaption>Employee Profile<br><span class="title">Booking Coordinator</span>
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Rafting Company Israel Huh Alegria</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook-square.svg"
                  alt="Facebook Icon"></a>
            <a href="https://linkedin.com"><img src="images/linkedin-square.svg"
                  alt="Linkedin Icon"></a>
            <a href="https://instagram.com"><img src="images/instagram-square.svg"
                  alt="Instagram Icond"></a>
        </nav>
    </footer>
</body>

</html>
