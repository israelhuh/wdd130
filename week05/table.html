<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables Experiment</title>
    <meta name="description"
      content="This is a site created to experiment and learn about tables in HTML and CSS">
    <meta name="author" content="Israel Huh">
    <link rel="stylesheet" href="styles/table.css">
</head>

<body>

    <header>
        <nav>
            <a href="">Papulingo</a>
            <a href="">Papito</a>
            <a href="">Papi</a>
        </nav>
    </header>

</body>

<main>
    <h1>Primera tabla</h1>
    <table>
        <thead>
            <tr>
                <th>NAME</th>
                <th>AGE</th>
                <th>SCORE</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Rogelia</td>
                <td>18</td>
                <td>80</td>
            </tr>
            <tr>
                <td colspan="2">27</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Students</td>
                <td>22.5</td>
                <td>75</td>
            </tr>
        </tfoot>
    </table>
</main>

</html>
